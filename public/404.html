<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Smooth AF Driving</title>
<script>
  var l = window.location;
  var seg = l.pathname.split('/');
  var repo = seg[1];
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    '/' + repo + '/?/' +
    seg.slice(2).join('/').replace(/&/g,'~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g,'~and~') : '') +
    l.hash
  );
</script>
</head>
</html>
