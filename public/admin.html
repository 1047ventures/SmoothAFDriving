<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>SmoothAF · Admin</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root { --bg:#0a0808; --cream:#f4ebd9; --dim:rgba(244,235,217,.55); --line:rgba(244,235,217,.12); }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--cream);
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; padding:24px; }
    h1 { font-size:18px; letter-spacing:.04em; margin:0 0 16px; }
    .hidden { display:none !important; }
    input { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
            background:#000; color:var(--cream); }
    button { font:inherit; padding:10px 16px; border-radius:8px; border:0; cursor:pointer;
             background:var(--cream); color:#080808; font-weight:600; }
    .err { color:#e8501a; font-size:13px; margin-top:8px; min-height:16px; }
    .tiles { display:flex; flex-wrap:wrap; gap:12px; margin:16px 0 24px; }
    .tile { flex:1 1 130px; background:#120f0f; border:1px solid var(--line); border-radius:12px; padding:14px; }
    .tile .v { font-size:26px; font-weight:700; }
    .tile .l { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin-top:4px; }
    svg { display:block; margin:8px 0 24px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
    th { color:var(--dim); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
    th[data-sort] { cursor:pointer; user-select:none; white-space:nowrap; }
    th[data-sort]:hover { color:var(--cream); }
    th .arrow { font-size:10px; margin-left:2px; }
    th[data-sort] .arrow { opacity:.3; }        /* dim hint: this column is sortable */
    th[data-sort].sorted .arrow { opacity:1; color:var(--cream); }
    tr.user-row { cursor:pointer; }
    tr.user-row:hover { background:#161212; }
    .anon { color:var(--dim); font-style:italic; }
    .drilldown td { background:#0f0c0c; font-size:12px; color:var(--dim); }
    .dd-table { width:100%; border-collapse:collapse; font-size:12px; }
    .dd-table th { font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em;
                   padding:4px 8px; border-bottom:1px solid var(--line); }
    .dd-table td { padding:6px 8px; border-bottom:1px solid var(--line); color:var(--cream); white-space:nowrap; }
    .dd-table .num { text-align:right; font-variant-numeric:tabular-nums; }
    .dd-table .dest { white-space:normal; color:var(--dim); }
    tr.drive-line { cursor:pointer; }
    tr.drive-line:hover > td { background:#161212; }
    tr.drive-line b { font-weight:600; }
    .drive-detail { padding:8px 6px 12px; background:#080606; }
    .dd-section { margin:6px 0; }
    .dd-h { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin-bottom:5px; }
    .chip { display:inline-block; background:#1a1515; border:1px solid var(--line); border-radius:999px;
            padding:3px 9px; margin:0 5px 5px 0; font-size:12px; color:var(--cream); }
    .chip b { font-weight:700; }
    .badge-acct { display:inline-block; font-size:9px; text-transform:uppercase; letter-spacing:.05em;
                  color:#8fcaff; border:1px solid #2b4a66; background:#122232; border-radius:4px; padding:1px 5px; vertical-align:middle; }
    .chart-cap { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:4px 0 2px; }
    .dd-routes { margin:6px 0 10px; }
    .routes-btn { font:inherit; font-size:13px; padding:7px 12px; border-radius:8px; border:1px solid var(--line);
                  background:#1a1515; color:var(--cream); cursor:pointer; }
    .routes-btn:hover { background:#241c1c; }
    .routes-map { display:none; margin-top:8px; }
    .rmap { height:300px; border-radius:10px; overflow:hidden; border:1px solid var(--line); }
    .rmap .leaflet-container { background:#0a0808; }
    /* Mute the basemap so the coloured route lines are what the eye lands on. */
    .rmap .leaflet-tile { filter:grayscale(1) brightness(.72) contrast(.9); }
    .dir-arrow { font-size:13px; line-height:1; text-align:center; text-shadow:0 0 2px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.9); }
    .rmap-cap { display:flex; flex-wrap:wrap; align-items:center; gap:4px; margin-top:6px; font-size:11px; color:var(--dim); }
    .rlegend { display:inline-flex; align-items:center; gap:6px; }
    .rlegend .bar { width:70px; height:8px; border-radius:4px;
                    background:linear-gradient(90deg,#E0431F,#E8B53A,#3FAE52); }
    .rlegend .dot { color:var(--cream); }
  </style>
</head>
<body>
  <h1>SmoothAF · Operator Dashboard</h1>

  <div id="gate">
    <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password">
    <button id="unlock">Unlock</button>
    <div id="gate-err" class="err"></div>
  </div>

  <div id="dash" class="hidden">
    <div id="tiles" class="tiles"></div>
    <div id="purge-note" class="anon" style="margin:2px 0 8px"></div>
    <div id="installs-cap" class="chart-cap"></div>
    <svg id="installs" width="100%" height="80" viewBox="0 0 600 80" preserveAspectRatio="xMinYMid meet"></svg>
    <table>
      <thead>
        <tr id="head-row">
          <th data-sort="name">User <span class="arrow"></span></th>
          <th data-sort="driveCount">Drives <span class="arrow"></span></th>
          <th data-sort="avgScore">Avg <span class="arrow"></span></th>
          <th data-sort="totalMiles">Miles <span class="arrow"></span></th>
          <th data-sort="flagsPerMile">Flags/mi <span class="arrow"></span></th>
          <th data-sort="firstSeen">First seen <span class="arrow"></span></th>
          <th data-sort="lastSeen">Last seen <span class="arrow"></span></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="dash-err" class="err"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const PW_KEY = 'saf_admin_pw';
    const fmtDate = (ms) => ms == null ? '—' : new Date(ms).toLocaleDateString();
    const fmtTime = (ms) => ms == null ? '—' :
      new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const shortId = (id) => id.slice(0, 8);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    async function call(view, extra = {}) {
      const password = sessionStorage.getItem(PW_KEY) || '';
      const res = await fetch('/api/admin-stats', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password, view, ...extra }),
      });
      if (res.status === 401) { sessionStorage.removeItem(PW_KEY); showGate('Wrong password.'); throw new Error('unauthorized'); }
      if (!res.ok) throw new Error('request failed (' + res.status + ')');
      return res.json();
    }

    function showGate(msg) {
      $('dash').classList.add('hidden');
      $('gate').classList.remove('hidden');
      $('gate-err').textContent = msg || '';
    }

    function renderTiles(o) {
      const tiles = [
        ['Users', o.totalUsers], ['Devices', o.totalDevices], ['Drives', o.totalDrives],
        ['Avg score', o.avgScore ?? '—'], ['Miles', o.totalMiles],
        ['Active 7d', o.activeUsers7d], ['Active 30d', o.activeUsers30d], ['Returning', o.returningUsers],
      ];
      $('tiles').innerHTML = tiles.map(([l, v]) =>
        `<div class="tile"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
    }

    // Miles/day: one bar per UTC day, height ∝ total miles driven that day.
    // Fixed-width bars (not stretched to fill), so a handful of days reads as a
    // few small bars instead of giant slabs. The <title> must be a CHILD of the
    // <rect> or the hover tooltip binds to the wrong bar.
    function renderMilesChart(byDay) {
      const svg = $('installs');
      byDay = byDay || [];
      if (!byDay.length) { svg.innerHTML = ''; $('installs-cap').textContent = ''; return; }
      const total = byDay.reduce((s, d) => s + d.miles, 0);
      $('installs-cap').innerHTML =
        `Miles / day <span class="anon">· ${total.toFixed(1)} mi across ${byDay.length} day${byDay.length === 1 ? '' : 's'}</span>`;
      const max = Math.max(...byDay.map(d => d.miles), 0.1);
      const bar = 18, h = 80;
      svg.setAttribute('viewBox', `0 0 ${Math.max(byDay.length * bar, bar)} ${h}`);
      svg.setAttribute('preserveAspectRatio', 'xMinYMid meet');
      svg.innerHTML = byDay.map((d, i) => {
        const bh = Math.max(2, (d.miles / max) * (h - 16));
        return `<rect x="${i * bar + 1}" y="${h - bh}" width="${bar - 3}" height="${bh}" rx="1" fill="#c4a962">` +
               `<title>${d.day}: ${d.miles.toFixed(1)} mi</title></rect>`;
      }).join('');
    }

    // Table sort state. Default is Last seen, newest first — matches how the
    // server already orders, and what you want to glance at first.
    let allRows = [];
    let sortKey = 'lastSeen';
    let sortDir = -1; // 1 asc, -1 desc
    const NUMERIC = new Set(['driveCount', 'avgScore', 'totalMiles', 'flagsPerMile', 'firstSeen', 'lastSeen']);

    function sortValue(r, key) {
      if (key === 'name') return (r.name || r.email || r.deviceId || '').toLowerCase();
      return r[key];
    }

    function sortedRows() {
      const rows = allRows.slice();
      rows.sort((a, b) => {
        const va = sortValue(a, sortKey), vb = sortValue(b, sortKey);
        // Missing values (no drives yet, anon with no score) always sink to the
        // bottom regardless of direction.
        const na = va == null || va === '', nb = vb == null || vb === '';
        if (na && nb) return 0;
        if (na) return 1;
        if (nb) return -1;
        if (va < vb) return -1 * sortDir;
        if (va > vb) return 1 * sortDir;
        return 0;
      });
      return rows;
    }

    function updateHeadArrows() {
      document.querySelectorAll('#head-row th[data-sort]').forEach(th => {
        const active = th.dataset.sort === sortKey;
        th.classList.toggle('sorted', active);
        // Active column shows its direction; the rest show a faint ↕ so it's
        // clear every header is clickable.
        th.querySelector('.arrow').textContent = active ? (sortDir === 1 ? '▲' : '▼') : '↕';
      });
    }

    function onHeadClick(key) {
      if (key === sortKey) { sortDir = -sortDir; }
      else { sortKey = key; sortDir = NUMERIC.has(key) ? -1 : 1; } // numbers big-first, names A→Z
      renderRows();
    }

    function renderRows() {
      const rows = sortedRows();
      updateHeadArrows();
      $('rows').innerHTML = rows.map(r => {
        const devNote = r.deviceCount > 1 ? ` <span class="anon">· ${r.deviceCount} devices</span>` : '';
        const acct = r.signedIn ? ` <span class="badge-acct">account</span>` : '';
        const who = r.isAnonymous
          ? `<span class="anon">Anonymous · ${esc(shortId(r.deviceId || ''))}</span>${devNote}`
          : `${r.name ? esc(r.name) : '—'}${acct}${devNote}<br><span class="anon">${esc(r.email || '')}</span>`;
        const devices = esc(JSON.stringify(r.deviceIds || [r.deviceId]));
        return `<tr class="user-row" data-devices='${devices}'>
          <td>${who}</td><td>${r.driveCount}</td><td>${r.avgScore ?? '—'}</td>
          <td>${r.totalMiles}</td><td>${r.flagsPerMile ?? '—'}</td>
          <td>${fmtDate(r.firstSeen)}</td><td>${fmtDate(r.lastSeen)}</td></tr>`;
      }).join('');
      document.querySelectorAll('.user-row').forEach(tr =>
        tr.addEventListener('click', () => toggleDrill(tr)));
    }

    const mi = (m) => (m / 1609.34).toFixed(1);

    // One drive as a table row; the full breakdown (OBD, flag tiers) loads on
    // click. Each drive carries its own device_id (a merged person spans several).
    const DD_COLS = 7;
    function driveRow(d) {
      const device = d.device_id || '';
      const stop = d.start_time != null && d.duration_ms ? d.start_time + d.duration_ms : null;
      const time = `${fmtTime(d.start_time)}–${fmtTime(stop)}`;
      const dest = d.dest_label ? esc(d.dest_label) : '';
      return `<tr class="drive-line" data-device="${esc(device)}" data-start="${esc(String(d.start_time))}">
        <td>${fmtDate(d.start_time)}</td>
        <td>${time}</td>
        <td class="num"><b>${d.score ?? '—'}</b></td>
        <td class="num">${mi(d.distance_meters)}</td>
        <td class="num">${Math.round((d.duration_ms || 0) / 60000)}</td>
        <td class="num">${d.event_count || 0}</td>
        <td class="dest">${dest}</td>
      </tr>`;
    }

    function driveTable(drives) {
      const head = `<thead><tr>
        <th>Date</th><th>Time</th><th class="num">Score</th><th class="num">Mi</th>
        <th class="num">Min</th><th class="num">Flags</th><th>Dest</th>
      </tr></thead>`;
      return `<table class="dd-table">${head}<tbody>${drives.map(driveRow).join('')}</tbody></table>`;
    }

    // The expanded detail for one drive: scoring breakdown, flag counts, OBD.
    function driveDetail(drive) {
      const dims = drive.dims || {};
      const f = drive.flags || { total: 0, byType: {}, byTier: {} };
      const o = drive.obd || null;
      const scoreRow = [
        ['Smoothness', dims.smoothness], ['Braking', dims.braking], ['Momentum', dims.momentum],
        ['Ride composure', dims.rideComposure], ['Speed mult', dims.speedBonus],
        ['Efficiency', drive.efficiency], ['vs ETA', drive.effectiveness != null ? drive.effectiveness + '%' : null],
      ].filter(([, v]) => v != null && v !== '')
       .map(([l, v]) => `<span class="chip">${l}: <b>${v}</b></span>`).join('') || '<span class="anon">No breakdown stored (older drive).</span>';

      const t = f.byType || {};
      const flagRow = f.total
        ? `<span class="chip">${f.total} flags</span>` +
          (t.brake ? `<span class="chip">🛑 ${t.brake} brake</span>` : '') +
          (t.accel ? `<span class="chip">⚡ ${t.accel} accel</span>` : '') +
          (t.turn  ? `<span class="chip">↩︎ ${t.turn} turn</span>` : '') +
          ` <span class="anon">tiers 1/2/3/4: ${[1,2,3,4].map(n => (f.byTier?.[n] || 0)).join('/')}</span>`
        : '<span class="anon">No harsh events flagged.</span>';

      const obdRow = o
        ? [['OBD coverage', o.coverage != null ? Math.round(o.coverage * 100) + '%' : null],
           ['Peak rpm', o.peakRpm], ['Avg throttle', o.avgThrottle != null ? o.avgThrottle + '%' : null],
           ['Peak hp', o.peakHp], ['Peak Nm', o.peakTorqueNm], ['Peak coolant', o.peakCoolant != null ? o.peakCoolant + '°' : null]]
          .filter(([, v]) => v != null).map(([l, v]) => `<span class="chip">${l}: <b>${v}</b></span>`).join('')
        : '<span class="anon">No OBD (no dongle connected).</span>';

      const hasRoute = Array.isArray(drive.path) && drive.path.length >= 2;
      const routeRow = hasRoute
        ? `<div class="dd-routes"><button type="button" class="drive-route-btn routes-btn">🗺 Show route</button><div class="routes-map drive-route-map"></div></div>`
        : '<span class="anon">No GPS track stored for this drive.</span>';

      return `<div class="dd-section"><div class="dd-h">Scoring</div>${scoreRow}</div>
        <div class="dd-section"><div class="dd-h">Flags</div>${flagRow}</div>
        <div class="dd-section"><div class="dd-h">Engine</div>${obdRow}</div>
        <div class="dd-section"><div class="dd-h">Route</div>${routeRow}</div>`;
    }

    async function toggleDrill(tr) {
      const next = tr.nextElementSibling;
      if (next && next.classList.contains('drilldown')) { next.remove(); return; }
      let deviceIds = [];
      try { deviceIds = JSON.parse(tr.dataset.devices) || []; } catch { deviceIds = []; }
      const data = await call('user', { device_ids: deviceIds });
      const list = data.drives.length
        ? driveTable(data.drives)
        : '<div class="anon" style="padding:8px 6px">No drives.</div>';
      const row = document.createElement('tr');
      row.className = 'drilldown';
      row.innerHTML =
        `<td colspan="7">
          <div class="dd-routes"><button type="button" class="routes-btn">🗺 Show routes</button><div class="routes-map"></div></div>
          ${list}
        </td>`;
      tr.after(row);
      row.querySelector('.routes-btn').addEventListener('click', (e) =>
        toggleRoutes(e.currentTarget, row.querySelector('.routes-map'), deviceIds));
      row.querySelectorAll('.drive-line').forEach(line =>
        line.addEventListener('click', () => toggleDriveDetail(line)));
    }

    // Traffic-light colour for a drive score: green = smooth, red = rough.
    function scoreColor(s) {
      if (s == null) return '#9aa0a6';   // grey when a drive has no score
      if (s >= 85) return '#3FAE52';      // green
      if (s >= 70) return '#E8B53A';      // amber
      return '#E0431F';                   // red
    }

    // Place arrowheads along a path so the direction of travel is clear.
    // A divIcon ▲ points north by default; rotate it to the local bearing.
    function addDirArrows(map, pts, color, count) {
      const n = pts.length;
      for (let k = 1; k <= count; k++) {
        const idx = Math.round((k / (count + 1)) * (n - 1));
        const a = pts[Math.max(0, idx - 1)], b = pts[Math.min(n - 1, idx + 1)];
        if (!a || !b) continue;
        const dy = b[0] - a[0];
        const dx = (b[1] - a[1]) * Math.cos(((a[0] + b[0]) / 2) * Math.PI / 180);
        const ang = Math.atan2(dx, dy) * 180 / Math.PI;   // 0 = north, clockwise
        const icon = L.divIcon({
          className: '',
          html: `<div class="dir-arrow" style="transform:rotate(${ang}deg);color:${color}">▲</div>`,
          iconSize: [16, 16], iconAnchor: [8, 8],
        });
        L.marker(pts[idx], { icon, interactive: false, keyboard: false }).addTo(map);
      }
    }

    const SCORE_LEGEND =
      `<div class="rlegend"><span>rough</span><span class="bar"></span><span>smooth</span>` +
      `<span class="dot" style="margin-left:10px">▲</span> direction</div>`;

    const HEAT_RED = '#E0431F';
    let _mapSeq = 0;
    // Draw route polylines into a container. Two modes:
    //   • byScore:false (the per-user overlay) — every line the same red at low
    //     opacity, so frequently-driven roads stack into darker lines.
    //   • byScore:true (the per-drive view) — colour the one line by its score
    //     (red→green) and draw direction arrows, with a legend.
    // `routes` is [{ path:[[lat,lon],…], score }].
    function drawRouteMap(container, routes, { weight = 4, opacity = 0.75, caption = '', arrows = false, byScore = true } = {}) {
      if (typeof L === 'undefined') {
        container.innerHTML = '<div class="anon" style="padding:10px">Map library didn\'t load — check your connection and reopen.</div>';
        return false;
      }
      const valid = (routes || []).filter(r => r && Array.isArray(r.path) && r.path.length >= 2);
      if (!valid.length) {
        container.innerHTML = '<div class="anon" style="padding:10px">No GPS track stored for this drive.</div>';
        return false;
      }
      const id = 'map' + (++_mapSeq);
      const cap = byScore
        ? `${SCORE_LEGEND}${caption ? `<span class="anon"> · ${caption}</span>` : ''}`
        : (caption ? `<span class="anon">${caption}</span>` : '');
      container.innerHTML = `<div id="${id}" class="rmap"></div>` + (cap ? `<div class="rmap-cap">${cap}</div>` : '');
      const map = L.map(id, { zoomControl: true });
      container._map = map;
      // Keyless OpenStreetMap tiles — the admin page is standalone and has no
      // Mapbox token (that's bundled into the app only). The basemap is greyed
      // via CSS so the route lines read clearly on it.
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
      const all = [];
      for (const r of valid) {
        const color = byScore ? scoreColor(r.score) : HEAT_RED;
        L.polyline(r.path, { color, weight, opacity }).addTo(map);
        if (arrows) addDirArrows(map, r.path, color, Math.min(6, Math.max(2, Math.floor(r.path.length / 8))));
        all.push(...r.path);
      }
      if (all.length) map.fitBounds(L.latLngBounds(all).pad(0.1));
      setTimeout(() => map.invalidateSize(), 60);
      return true;
    }

    // Generic show/hide toggle for a lazily-rendered map. `render()` runs once on
    // first reveal and returns true if it mounted a map.
    async function toggleMap(btn, container, labels, render) {
      if (container.dataset.loaded) {
        const show = container.style.display === 'none';
        container.style.display = show ? 'block' : 'none';
        btn.textContent = show ? labels.hide : labels.show;
        if (show && container._map) container._map.invalidateSize();
        return;
      }
      btn.textContent = labels.loading;
      container.style.display = 'block';
      container.dataset.loaded = '1';
      const ok = await render();
      btn.textContent = ok ? labels.hide : labels.show;
    }

    function toggleRoutes(btn, container, deviceIds) {
      return toggleMap(btn, container, { show: '🗺 Show routes', hide: '🗺 Hide routes', loading: 'Loading routes…' },
        async () => {
          const { tracks } = await call('tracks', { device_ids: deviceIds });
          const routes = (tracks || []).map(t => ({ path: t.path, score: t.score }));
          return drawRouteMap(container, routes, {
            byScore: false, opacity: 0.3, weight: 4,
            caption: routes.length ? `${routes.length} drive${routes.length === 1 ? '' : 's'} · darker lines = roads driven more often` : '',
          });
        });
    }

    async function toggleDriveDetail(line) {
      const nxt = line.nextElementSibling;
      if (nxt && nxt.classList.contains('drive-detail')) { nxt.remove(); return; }
      const data = await call('drive', { device_id: line.dataset.device, start_time: Number(line.dataset.start) });
      const tr = document.createElement('tr');
      tr.className = 'drive-detail';
      tr.innerHTML = `<td colspan="${DD_COLS}">${driveDetail(data.drive)}</td>`;
      line.after(tr);
      // This one drive's route, mapped on demand (path already came back above).
      const rbtn = tr.querySelector('.drive-route-btn');
      if (rbtn) {
        const rmap = tr.querySelector('.drive-route-map');
        rbtn.addEventListener('click', () =>
          toggleMap(rbtn, rmap, { show: '🗺 Show route', hide: '🗺 Hide route', loading: 'Loading route…' },
            async () => drawRouteMap(rmap, [{ path: data.drive.path, score: data.drive.score }],
              { opacity: 0.95, weight: 5, arrows: true,
                caption: data.drive.snapped ? 'snapped to roads' : '' })));
      }
    }

    async function load() {
      try {
        const data = await call('overview');
        $('gate').classList.add('hidden');
        $('dash').classList.remove('hidden');
        renderTiles(data.overview);
        renderMilesChart(data.overview.milesByDay);
        allRows = data.users;
        renderRows();
        $('purge-note').textContent = data.purgedEmpty
          ? `🧹 auto-removed ${data.purgedEmpty} empty drive${data.purgedEmpty === 1 ? '' : 's'} (0 mi · 0 flags)`
          : '';
      } catch (e) {
        if (e.message !== 'unauthorized') $('dash-err').textContent = e.message;
      }
    }

    $('unlock').addEventListener('click', () => {
      sessionStorage.setItem(PW_KEY, $('pw').value);
      load();
    });
    $('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('unlock').click(); });

    // Click a column header to sort by it; click again to flip direction.
    document.querySelectorAll('#head-row th[data-sort]').forEach(th =>
      th.addEventListener('click', () => onHeadClick(th.dataset.sort)));

    if (sessionStorage.getItem(PW_KEY)) load(); else showGate('');
  </script>
</body>
</html>
