<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>SmoothAF · Admin</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root { --bg:#0a0808; --cream:#f4ebd9; --dim:rgba(244,235,217,.55); --line:rgba(244,235,217,.12); }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--cream);
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; padding:24px; }
    h1 { font-size:18px; letter-spacing:.04em; margin:0 0 16px; }
    .hidden { display:none !important; }
    input { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
            background:#000; color:var(--cream); }
    button { font:inherit; padding:10px 16px; border-radius:8px; border:0; cursor:pointer;
             background:var(--cream); color:#080808; font-weight:600; }
    .err { color:#e8501a; font-size:13px; margin-top:8px; min-height:16px; }
    .tiles { display:flex; flex-wrap:wrap; gap:12px; margin:16px 0 24px; }
    .tile { flex:1 1 130px; background:#120f0f; border:1px solid var(--line); border-radius:12px; padding:14px; }
    .tile .v { font-size:26px; font-weight:700; }
    .tile .l { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin-top:4px; }
    svg { display:block; margin:8px 0 24px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
    th { color:var(--dim); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
    tr.user-row { cursor:pointer; }
    tr.user-row:hover { background:#161212; }
    .anon { color:var(--dim); font-style:italic; }
    .drilldown td { background:#0f0c0c; font-size:12px; color:var(--dim); }
    .drive-line { padding:7px 6px; border-bottom:1px solid var(--line); cursor:pointer; color:var(--cream); }
    .drive-line:last-child { border-bottom:0; }
    .drive-line:hover { background:#161212; }
    .drive-line b { font-weight:600; }
    .drive-detail { padding:8px 6px 12px; background:#080606; }
    .dd-section { margin:6px 0; }
    .dd-h { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin-bottom:5px; }
    .chip { display:inline-block; background:#1a1515; border:1px solid var(--line); border-radius:999px;
            padding:3px 9px; margin:0 5px 5px 0; font-size:12px; color:var(--cream); }
    .chip b { font-weight:700; }
    .dd-routes { margin:6px 0 10px; }
    .routes-btn { font:inherit; font-size:13px; padding:7px 12px; border-radius:8px; border:1px solid var(--line);
                  background:#1a1515; color:var(--cream); cursor:pointer; }
    .routes-btn:hover { background:#241c1c; }
    .routes-map { display:none; margin-top:8px; }
    .rmap { height:300px; border-radius:10px; overflow:hidden; border:1px solid var(--line); }
    .rmap .leaflet-container { background:#0a0808; }
    /* Mute the basemap so the red route lines are what the eye lands on. */
    .rmap .leaflet-tile { filter:grayscale(1) brightness(.72) contrast(.9); }
  </style>
</head>
<body>
  <h1>SmoothAF · Operator Dashboard</h1>

  <div id="gate">
    <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password">
    <button id="unlock">Unlock</button>
    <div id="gate-err" class="err"></div>
  </div>

  <div id="dash" class="hidden">
    <div id="tiles" class="tiles"></div>
    <div id="purge-note" class="anon" style="margin:2px 0 8px"></div>
    <svg id="installs" width="100%" height="80" viewBox="0 0 600 80" preserveAspectRatio="none"></svg>
    <table>
      <thead>
        <tr><th>User</th><th>Drives</th><th>Avg</th><th>Miles</th><th>Flags/mi</th><th>First seen</th><th>Last seen</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="dash-err" class="err"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const PW_KEY = 'saf_admin_pw';
    const fmtDate = (ms) => ms == null ? '—' : new Date(ms).toLocaleDateString();
    const fmtTime = (ms) => ms == null ? '—' :
      new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const shortId = (id) => id.slice(0, 8);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    async function call(view, extra = {}) {
      const password = sessionStorage.getItem(PW_KEY) || '';
      const res = await fetch('/api/admin-stats', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password, view, ...extra }),
      });
      if (res.status === 401) { sessionStorage.removeItem(PW_KEY); showGate('Wrong password.'); throw new Error('unauthorized'); }
      if (!res.ok) throw new Error('request failed (' + res.status + ')');
      return res.json();
    }

    function showGate(msg) {
      $('dash').classList.add('hidden');
      $('gate').classList.remove('hidden');
      $('gate-err').textContent = msg || '';
    }

    function renderTiles(o) {
      const tiles = [
        ['Users', o.totalUsers], ['Devices', o.totalDevices], ['Drives', o.totalDrives],
        ['Avg score', o.avgScore ?? '—'], ['Miles', o.totalMiles],
        ['Active 7d', o.activeUsers7d], ['Active 30d', o.activeUsers30d], ['Returning', o.returningUsers],
      ];
      $('tiles').innerHTML = tiles.map(([l, v]) =>
        `<div class="tile"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
    }

    function renderInstalls(byDay) {
      const svg = $('installs');
      if (!byDay.length) { svg.innerHTML = ''; return; }
      const max = Math.max(...byDay.map(d => d.count), 1);
      const w = 600, h = 80, bw = w / byDay.length;
      svg.innerHTML = byDay.map((d, i) => {
        const bh = (d.count / max) * (h - 16);
        return `<rect x="${i * bw + 1}" y="${h - bh}" width="${Math.max(1, bw - 2)}" height="${bh}" fill="#c4a962"></rect>` +
               `<title>${d.day}: ${d.count}</title>`;
      }).join('');
    }

    function renderRows(rows) {
      $('rows').innerHTML = rows.map(r => {
        const devNote = r.deviceCount > 1 ? ` <span class="anon">· ${r.deviceCount} devices</span>` : '';
        const who = r.isAnonymous
          ? `<span class="anon">Anonymous · ${esc(shortId(r.deviceId || ''))}</span>${devNote}`
          : `${r.name ? esc(r.name) : '—'}${devNote}<br><span class="anon">${esc(r.email || '')}</span>`;
        const devices = esc(JSON.stringify(r.deviceIds || [r.deviceId]));
        return `<tr class="user-row" data-devices='${devices}'>
          <td>${who}</td><td>${r.driveCount}</td><td>${r.avgScore ?? '—'}</td>
          <td>${r.totalMiles}</td><td>${r.flagsPerMile ?? '—'}</td>
          <td>${fmtDate(r.firstSeen)}</td><td>${fmtDate(r.lastSeen)}</td></tr>`;
      }).join('');
      document.querySelectorAll('.user-row').forEach(tr =>
        tr.addEventListener('click', () => toggleDrill(tr)));
    }

    const mi = (m) => (m / 1609.34).toFixed(1);

    // One drive summarised as a clickable line; the breakdown loads on expand.
    // Each drive carries its own device_id (a merged person spans several).
    function driveLine(d) {
      const device = d.device_id || '';
      const dims = d.dims || {};
      const bits = [];
      if (dims.smoothness != null) bits.push(`sm ${dims.smoothness}`);
      if (dims.braking != null)    bits.push(`br ${dims.braking}`);
      if (dims.momentum != null)   bits.push(`mo ${dims.momentum}`);
      const breakdown = bits.length ? ` <span class="anon">(${bits.join(' · ')})</span>` : '';
      const eff = d.effectiveness != null ? ` · ${d.effectiveness}% vs ETA` : '';
      const dest = d.dest_label ? ` → ${esc(d.dest_label)}` : '';
      const flags = d.event_count ? ` · ${d.event_count} flag${d.event_count === 1 ? '' : 's'}` : '';
      const stop = d.start_time != null && d.duration_ms ? d.start_time + d.duration_ms : null;
      const when = `${fmtDate(d.start_time)} · ${fmtTime(d.start_time)}–${fmtTime(stop)}`;
      return `<div class="drive-line" data-device="${esc(device)}" data-start="${esc(String(d.start_time))}">
        ${when} · <b>score ${d.score ?? '—'}</b>${breakdown} · ${mi(d.distance_meters)} mi · ${Math.round((d.duration_ms || 0) / 60000)} min${flags}${eff}${dest}
      </div>`;
    }

    // The expanded detail for one drive: scoring breakdown, flag counts, OBD.
    function driveDetail(drive) {
      const dims = drive.dims || {};
      const f = drive.flags || { total: 0, byType: {}, byTier: {} };
      const o = drive.obd || null;
      const scoreRow = [
        ['Smoothness', dims.smoothness], ['Braking', dims.braking], ['Momentum', dims.momentum],
        ['Ride composure', dims.rideComposure], ['Speed mult', dims.speedBonus],
        ['Efficiency', drive.efficiency], ['vs ETA', drive.effectiveness != null ? drive.effectiveness + '%' : null],
      ].filter(([, v]) => v != null && v !== '')
       .map(([l, v]) => `<span class="chip">${l}: <b>${v}</b></span>`).join('') || '<span class="anon">No breakdown stored (older drive).</span>';

      const t = f.byType || {};
      const flagRow = f.total
        ? `<span class="chip">${f.total} flags</span>` +
          (t.brake ? `<span class="chip">🛑 ${t.brake} brake</span>` : '') +
          (t.accel ? `<span class="chip">⚡ ${t.accel} accel</span>` : '') +
          (t.turn  ? `<span class="chip">↩︎ ${t.turn} turn</span>` : '') +
          ` <span class="anon">tiers 1/2/3/4: ${[1,2,3,4].map(n => (f.byTier?.[n] || 0)).join('/')}</span>`
        : '<span class="anon">No harsh events flagged.</span>';

      const obdRow = o
        ? [['OBD coverage', o.coverage != null ? Math.round(o.coverage * 100) + '%' : null],
           ['Peak rpm', o.peakRpm], ['Avg throttle', o.avgThrottle != null ? o.avgThrottle + '%' : null],
           ['Peak hp', o.peakHp], ['Peak Nm', o.peakTorqueNm], ['Peak coolant', o.peakCoolant != null ? o.peakCoolant + '°' : null]]
          .filter(([, v]) => v != null).map(([l, v]) => `<span class="chip">${l}: <b>${v}</b></span>`).join('')
        : '<span class="anon">No OBD (no dongle connected).</span>';

      return `<div class="dd-section"><div class="dd-h">Scoring</div>${scoreRow}</div>
        <div class="dd-section"><div class="dd-h">Flags</div>${flagRow}</div>
        <div class="dd-section"><div class="dd-h">Engine</div>${obdRow}</div>`;
    }

    async function toggleDrill(tr) {
      const next = tr.nextElementSibling;
      if (next && next.classList.contains('drilldown')) { next.remove(); return; }
      let deviceIds = [];
      try { deviceIds = JSON.parse(tr.dataset.devices) || []; } catch { deviceIds = []; }
      const data = await call('user', { device_ids: deviceIds });
      const list = data.drives.length
        ? data.drives.map(d => driveLine(d)).join('')
        : 'No drives.';
      const row = document.createElement('tr');
      row.className = 'drilldown';
      row.innerHTML =
        `<td colspan="7">
          <div class="dd-routes"><button type="button" class="routes-btn">🗺 Show routes</button><div class="routes-map"></div></div>
          ${list}
        </td>`;
      tr.after(row);
      row.querySelector('.routes-btn').addEventListener('click', (e) =>
        toggleRoutes(e.currentTarget, row.querySelector('.routes-map'), deviceIds));
      row.querySelectorAll('.drive-line').forEach(line =>
        line.addEventListener('click', () => toggleDriveDetail(line)));
    }

    let _mapSeq = 0;
    async function toggleRoutes(btn, container, deviceIds) {
      if (container.dataset.loaded) { // toggle visibility
        const show = container.style.display === 'none';
        container.style.display = show ? 'block' : 'none';
        btn.textContent = show ? '🗺 Hide routes' : '🗺 Show routes';
        if (show && container._map) container._map.invalidateSize();
        return;
      }
      btn.textContent = 'Loading routes…';
      const { tracks } = await call('tracks', { device_ids: deviceIds });
      container.dataset.loaded = '1';
      container.style.display = 'block';
      if (!tracks || !tracks.length) { container.innerHTML = '<div class="anon" style="padding:10px">No GPS tracks stored for these drives.</div>'; btn.textContent = '🗺 Routes'; return; }
      if (typeof L === 'undefined') { container.innerHTML = '<div class="anon" style="padding:10px">Map library didn\'t load — check your connection and reopen.</div>'; btn.textContent = '🗺 Routes'; return; }
      const id = 'map' + (++_mapSeq);
      container.innerHTML = `<div id="${id}" class="rmap"></div><div class="anon" style="margin-top:6px">${tracks.length} drive${tracks.length === 1 ? '' : 's'} · darker lines = roads driven more often</div>`;
      const map = L.map(id, { zoomControl: true });
      container._map = map;
      // Keyless OpenStreetMap tiles — the admin page is standalone and has no
      // Mapbox token (that's bundled into the app only). Light basemap, but the
      // orange route lines read fine on it and it never shows "API KEY REQUIRED".
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
      const all = [];
      for (const trk of tracks) {
        if (!trk.path || trk.path.length < 2) continue;
        // Low opacity so overlapping (frequently-driven) roads stack into brighter lines.
        L.polyline(trk.path, { color: '#E0431F', weight: 4, opacity: 0.3 }).addTo(map);
        all.push(...trk.path);
      }
      if (all.length) map.fitBounds(L.latLngBounds(all).pad(0.1));
      setTimeout(() => map.invalidateSize(), 60);
      btn.textContent = '🗺 Hide routes';
    }

    async function toggleDriveDetail(line) {
      const nxt = line.nextElementSibling;
      if (nxt && nxt.classList.contains('drive-detail')) { nxt.remove(); return; }
      const data = await call('drive', { device_id: line.dataset.device, start_time: Number(line.dataset.start) });
      const div = document.createElement('div');
      div.className = 'drive-detail';
      div.innerHTML = driveDetail(data.drive);
      line.after(div);
    }

    async function load() {
      try {
        const data = await call('overview');
        $('gate').classList.add('hidden');
        $('dash').classList.remove('hidden');
        renderTiles(data.overview);
        renderInstalls(data.overview.installsByDay);
        renderRows(data.users);
        $('purge-note').textContent = data.purgedEmpty
          ? `🧹 auto-removed ${data.purgedEmpty} empty drive${data.purgedEmpty === 1 ? '' : 's'} (0 mi · 0 flags)`
          : '';
      } catch (e) {
        if (e.message !== 'unauthorized') $('dash-err').textContent = e.message;
      }
    }

    $('unlock').addEventListener('click', () => {
      sessionStorage.setItem(PW_KEY, $('pw').value);
      load();
    });
    $('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('unlock').click(); });

    if (sessionStorage.getItem(PW_KEY)) load(); else showGate('');
  </script>
</body>
</html>
