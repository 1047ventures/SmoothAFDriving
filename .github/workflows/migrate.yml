name: DB Migrate

# Applies pending Supabase migrations (supabase/migrations/*.sql) automatically
# whenever they change on the production branch. Also runnable on demand.
#
# Requires one repo secret: SUPABASE_DB_URL
#   Supabase dashboard → Project Settings → Database → Connection string →
#   **Session pooler** (URI, includes the password). Use the Session pooler /
#   IPv4 string, NOT the "Direct connection" — GitHub runners are IPv4-only and
#   Supabase direct connections are IPv6. Session mode (port 5432) supports DDL.
#
# Without the secret the job skips cleanly, so this never blocks a merge.

on:
  push:
    branches: [claude-pwa]
    paths: ['supabase/migrations/**']
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/run-migrations.sh
