name: iOS → TestFlight

# Push to main → macOS runner builds the app → uploads to TestFlight.
# Replaces Xcode Cloud entirely: nothing to configure in Xcode, no workflow
# editor, no local machine involved.
#
# One-time setup (see NATIVE.md): three repo secrets from an App Store Connect
# API key. Signing is handled by -allowProvisioningUpdates using that key, so
# there are no certificates or provisioning profiles to manage by hand.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:        # lets you trigger a build manually from the Actions tab

concurrency:
  group: ios-testflight
  cancel-in-progress: false  # never cancel a half-finished upload

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Apple rejects uploads built against an old SDK ("This app was built with
      # the iOS 18.5 SDK. All iOS apps must be built with the iOS 26 SDK or
      # later"). Runner images ship several Xcodes side by side and default to
      # an older one, so pick the newest and fail loudly if it is still too old
      # — better than burning a full build to find out at the upload step.
      - name: Select the newest Xcode
        run: |
          echo "Xcode versions on this runner:"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "  (none found)"
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then echo "::error::No Xcode found on runner"; exit 1; fi
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version
          echo "iOS SDKs available:"
          xcodebuild -showsdks | grep -i iphoneos || true
          XCODE_MAJOR=$(xcodebuild -version | head -1 | sed 's/Xcode \([0-9]*\).*/\1/')
          if [ "$XCODE_MAJOR" -lt 26 ]; then
            echo "::error::Xcode $XCODE_MAJOR is too old — App Store Connect requires Xcode 26+ (iOS 26 SDK). Runner image needs updating."
            exit 1
          fi

          # Xcode 26 ships without its platform SDKs pre-installed, and the
          # runner image does not download them. Without the iOS platform the
          # archive fails with the unhelpful "Supported platforms for the
          # buildables in the current scheme is empty" and then "archive not
          # found" — which reads like a project fault rather than a missing SDK.
          if ! xcodebuild -showsdks | grep -qi iphoneos; then
            echo "No iOS SDK present — downloading the platform (this takes a few minutes)."
            xcodebuild -downloadPlatform iOS
            xcodebuild -showsdks | grep -i iphoneos \
              || { echo "::error::iOS platform still missing after download."; exit 1; }
          fi

      - name: Use Node 22 (Capacitor CLI requires >= 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Resolved BEFORE the web build so the bundle can bake the same number the
      # native project is stamped with. The in-app badge used to be a
      # hand-edited constant and had drifted — the app reported v124 while
      # running build 118 — which makes a bug report impossible to place.
      #
      # App Store Connect rejects a build number it has already seen. The
      # project hardcodes 1, so use the run number — monotonic per repo, and
      # offset so it can never collide with the manual 1.0 (1) upload.
      - name: Resolve build number
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} + 100 ))
          echo "Using build number $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Build web app
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
        run: npm run build

      - name: Sync web build into the iOS project
        run: npx cap sync ios

      - name: Apply iOS privacy strings + export compliance
        run: bash scripts/ios-privacy.sh

      - name: Stamp build number into the Xcode project
        run: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9][0-9.]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" \
            ios/App/App.xcodeproj/project.pbxproj

      - name: Write App Store Connect API key
        env:
          KEY_ID:      ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          # altool/xcodebuild both look for this exact filename convention.
          printf '%s' "$PRIVATE_KEY" > ~/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${KEY_ID}.p8

      # Every runner starts with an empty keychain. Without a certificate in it,
      # -allowProvisioningUpdates asks Apple for a NEW distribution certificate
      # on every single build — which is how this account accumulated twenty of
      # them and hit the cap, at which point signing simply stops working and
      # the archive fails with no useful message.
      #
      # Importing one certificate we own means Xcode finds a usable identity and
      # reuses it instead of minting another. Optional on purpose: with no
      # secret set the build still runs exactly as before, so adding this could
      # not break a working pipeline.
      - name: Import signing certificate
        env:
          CERT_P12:     ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::warning::No IOS_DIST_CERT_P12 secret set — Xcode will create a new"
            echo "::warning::distribution certificate for this build. Apple caps these, and"
            echo "::warning::once the cap is hit every build fails until you revoke some."
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          # Ephemeral password for an ephemeral keychain on a throwaway runner.
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this, codesign blocks on a GUI prompt that nobody can answer
          # and the build hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # Keep the login keychain in the search list; xcodebuild needs both.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"

          echo "Imported signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Archive WITHOUT signing, then sign only at export.
      #
      # The Xcode project pins CODE_SIGN_IDENTITY = "iPhone Developer", so a
      # signed archive under automatic signing demands an iOS *Development*
      # certificate + profile — and tries to mint a new one every build, which
      # is what hits Apple's certificate cap and fails with "reached the maximum
      # number of certificates". But a TestFlight build never needs a
      # development identity: the export step below re-signs the app for App
      # Store distribution using the imported distribution cert + the API key.
      # So we archive unsigned (CODE_SIGNING_ALLOWED=NO) and let export own all
      # signing. No dev cert, no minting, no cap — deterministic every run.
      - name: Archive
        run: |
          # Raw output goes to a file, xcpretty only prettifies what's shown.
          # Piping straight into xcpretty means a failure prints nothing but
          # "** ARCHIVE FAILED **" — which is how this build stayed undiagnosable
          # through several attempts. On failure, dump the real log.
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=J55RP92WN6 \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | xcpretty || ARCHIVE_RC=$?

          if [ ! -d "$RUNNER_TEMP/App.xcarchive" ]; then
            echo "::group::Raw xcodebuild output (last 300 lines)"
            tail -300 "$RUNNER_TEMP/archive.log"
            echo "::endgroup::"
            echo "::error::Archive failed — see the raw output above."
            exit "${ARCHIVE_RC:-1}"
          fi

      - name: Export .ipa
        env:
          KEY_ID:    ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Upload to TestFlight
        env:
          KEY_ID:    ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          echo "Uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      # Keeps the build inspectable if the upload step fails.
      - name: Upload .ipa as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
