[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# The client calls host-neutral /api/* paths. On Cloudflare Pages those are
# served by functions/api/*; on Netlify, map them back to the Netlify functions
# so the same build works on either host.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/tracker"
  to = "/"
  status = 200

[[redirects]]
  from = "/install"
  to = "/install.html"
  status = 200
