<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Denver Drivers Cards</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:ital,wght@0,400;0,600;1,300&display=swap">
<!--
  Print source for the "Denver drivers" windshield cards (design canvas: Round 3).
  Open with a hash, then print to PDF at 100%:
    #sheet-N   10 of card N on a US Letter sheet, with cut marks (home printing)
    #bleed-N   card N alone, 3.75 × 2.25 in: 1/8 in bleed all round (print shops)
    #mix20     20 smaller cards (72% size, about 2.5 × 1.4 in) on a landscape Letter sheet,
               all three designs in turn (7 / 7 / 6), with cut marks
    #preview   all three side by side
  Each card has its own QR (smoothafdriving.pages.dev/c/<code>), so /admin counts scans per card.
  Card art is 336 × 192 px = 3.5 × 2 in at 96 px/in. Keep text 12 px (1/8 in) inside the edge.
-->
<style>
  body{margin:0;background:#fff;font-family:'DM Sans',-apple-system,Arial,sans-serif}
  .card{width:336px;height:192px;position:relative;overflow:hidden;background:#0B0B0C;color:#F2F1EE;box-sizing:border-box;
        -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .card *{margin:0}
  .h1{position:absolute;left:17px;top:21px;width:200px;font:800 27px/.94 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.005em;text-transform:uppercase;color:#F2F1EE}
  .h2{position:absolute;left:17px;top:54px;width:189px;font:800 23px/.94 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.005em;text-transform:uppercase;color:#F2F1EE}
  .o{color:#FF6A3D}
  .body{position:absolute;left:18px;top:110px;width:180px;font-size:10px;line-height:1.2;color:#B8B7B2}
  .cheers{position:absolute;left:18px;top:156px;font:700 14px/1 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.02em;color:#FFB23D}
  .qr{position:absolute;left:219px;top:35.65px;width:96px;height:96px;box-sizing:border-box;padding:6px;background:#F2F1EE;border-radius:8px}
  .qr img{display:block;width:100%;height:100%}
  .s3{position:absolute;font:italic 300 8px/1.3 'DM Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;text-align:center;color:#F2F1EE}
  /* bleed: the same art centred in a 360 × 216 px dark field */
  .bleed{width:360px;height:216px;background:#0B0B0C;position:relative;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bleed .card{position:absolute;left:12px;top:12px}
  .sheet{width:816px;height:1056px;position:relative}
  .grid{position:absolute;left:72px;top:48px;display:grid;grid-template-columns:336px 336px;grid-auto-rows:192px}
  .mark{position:absolute;background:#999}
  .mix{width:1056px;height:816px;position:relative}
  .mixgrid{position:absolute;left:44px;top:62px;display:grid;grid-template-columns:repeat(4,241.92px);grid-auto-rows:138.24px}
  .mini{width:241.92px;height:138.24px;overflow:hidden}
  .mini .card{transform:scale(.72);transform-origin:0 0}
  .preview{display:flex;gap:24px;padding:24px;background:#1b1b1d;flex-wrap:wrap}
</style>
</head>
<body>
<div id="out"></div>
<script>
const CARDS = [
  // Positions copied from each card on the design canvas (Round 3).
  { qr: 'qr-outhere.svg', h2: `Let's get <span class="o">Smooth AF</span> out here.`, h2Top: 54, h2Lh: .94, h2W: 180,
    body: "I'm building a new driving app. You should download it and tell me why it won't work.", bodyTop: 110,
    cheersTop: 156.3, qrTop: 33.65, tag: { left: 226, top: 150, width: 83 } },
  { qr: 'qr-showme.svg', h2: `Show me how <span class="o">smooth</span> you are.`, h2Top: 51, h2Lh: 1, h2W: 189,
    body: "I'm building a driving app that scores every drive. Download it, try it, and tell me what sucks.", bodyTop: 108,
    cheersTop: 156, qrTop: 35.65, tag: { left: 224, top: 155, width: 86 } },
  { qr: 'qr-smoothest.svg', h2: `Who's the <span class="o">smoothest?</span>`, h2Top: 52, h2Lh: 1, h2W: 189,
    body: "I'm building a new driving app to find out. Download it, score a drive, and roast it. I can take it.", bodyTop: 108,
    cheersTop: 156, qrTop: 35.65, tag: { left: 224, top: 155, width: 86 } },
];
const card = c => `<div class="card">
  <div class="h1"><span class="o">Denver</span> drivers,</div>
  <div class="h2" style="top:${c.h2Top}px;line-height:${c.h2Lh};width:${c.h2W}px">${c.h2}</div>
  <p class="body" style="top:${c.bodyTop}px">${c.body}</p>
  <div class="cheers" style="top:${c.cheersTop}px">Cheers.</div>
  <div class="qr" style="top:${c.qrTop}px"><img src="${c.qr}" alt=""></div>
  <div class="s3" style="left:${c.tag.left}px;top:${c.tag.top}px;width:${c.tag.width}px">Smooth AF Driving School</div>
</div>`;
const out = document.getElementById('out');
const page = (w, h) => { const s = document.createElement('style'); s.textContent = `@page{size:${w} ${h};margin:0}`; document.head.appendChild(s); };
if (location.hash === '#mix20'){
  page('11in', '8.5in');
  const W = 241.92, H = 138.24, L = 44, T = 62;
  let marks = '';
  for (let i = 0; i <= 4; i++){ const x = L + i * W; marks += `<div class="mark" style="left:${x}px;top:${T - 30}px;width:.6px;height:22px"></div><div class="mark" style="left:${x}px;top:${T + 5 * H + 8}px;width:.6px;height:22px"></div>`; }
  for (let i = 0; i <= 5; i++){ const y = T + i * H; marks += `<div class="mark" style="top:${y}px;left:${L - 30}px;height:.6px;width:22px"></div><div class="mark" style="top:${y}px;left:${L + 4 * W + 8}px;height:.6px;width:22px"></div>`; }
  const cells = Array.from({ length: 20 }, (_, i) => `<div class="mini">${card(CARDS[i % 3])}</div>`).join('');
  out.innerHTML = `<div class="mix"><div class="mixgrid">${cells}</div>${marks}</div>`;
}
const m = /^#(sheet|bleed)-(\d)$/.exec(location.hash);
if (m && CARDS[m[2] - 1]){
  const c = CARDS[m[2] - 1];
  if (m[1] === 'bleed'){ page('3.75in', '2.25in'); out.innerHTML = `<div class="bleed">${card(c)}</div>`; }
  else {
    page('8.5in', '11in');
    const L = 72, T = 48, xs = [L, L + 336, L + 672], ys = [0, 1, 2, 3, 4, 5].map(i => T + i * 192);
    let marks = '';
    for (const x of xs) marks += `<div class="mark" style="left:${x}px;top:${T - 30}px;width:.6px;height:22px"></div><div class="mark" style="left:${x}px;top:${T + 960 + 8}px;width:.6px;height:22px"></div>`;
    for (const y of ys) marks += `<div class="mark" style="top:${y}px;left:${L - 30}px;height:.6px;width:22px"></div><div class="mark" style="top:${y}px;left:${L + 672 + 8}px;height:.6px;width:22px"></div>`;
    out.innerHTML = `<div class="sheet"><div class="grid">${Array(10).fill(card(c)).join('')}</div>${marks}</div>`;
  }
} else if (location.hash !== '#mix20'){
  out.innerHTML = `<div class="preview">${CARDS.map(card).join('')}</div>`;
}
</script>
</body>
</html>
